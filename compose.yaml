# 앱과 마이그레이션 컨테이너가 동일한 내부 DB URL을 사용한다.
# 비밀번호에는 URL 예약 문자(@, :, /, ?, #, %)를 사용하지 않는 것을 권장한다.
x-database-environment: &database-environment
  DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public"
  DIRECT_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul

    volumes:
      # 기본값은 Compose 파일 아래의 data/backups 폴더다.
      # NAS에서 다른 공유 폴더를 쓰려면 .env.nas의 경로 변수만 바꾼다.
      - ${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
      - ${POSTGRES_BACKUP_PATH:-./backups}:/backups

    healthcheck:
      # 최초 initdb가 띄우는 임시 서버를 정상 상태로 오인하지 않도록
      # PID 1이 최종 postgres 프로세스인지 확인한 후 접속을 검사한다.
      # $$는 Compose가 아니라 컨테이너 내부 셸에서 환경변수를 확장하게 한다.
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = \"postgres\" && pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # DB 포트는 호스트에 공개하지 않는다. app과 migrate만 내부 db:5432로 접속한다.

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"

    depends_on:
      db:
        condition: service_healthy

    environment:
      <<: *database-environment
      # NAS 디스크가 느린 경우에도 총 30초 동안 일시적인 연결 실패를 재시도한다.
      MIGRATION_MAX_ATTEMPTS: ${MIGRATION_MAX_ATTEMPTS:-10}
      MIGRATION_RETRY_SECONDS: ${MIGRATION_RETRY_SECONDS:-3}

    # 이미지의 진입 스크립트가 migrate deploy를 실행한다.
    # 적용할 마이그레이션이 없으면 Prisma가 안전하게 성공 종료한다.

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    init: true

    depends_on:
      # DB 접속 가능 여부뿐 아니라 전체 Prisma 마이그레이션 성공까지 기다린다.
      migrate:
        condition: service_completed_successfully

    environment:
      <<: *database-environment
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-nas-test}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_URL: ${AUTH_URL:-http://localhost:31000}

    ports:
      - "${APP_PORT:-31000}:3000"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
